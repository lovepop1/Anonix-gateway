# Example NGINX edge proxy forwarding verified identity headers to Anonix Gateway.
server {
    listen 443 ssl http2;
    server_name mask.example.com;

    ssl_certificate     /etc/ssl/certs/fullchain.pem;
    ssl_certificate_key /etc/ssl/private/privkey.pem;

    location / {
        # Overwrite any client-supplied X-Anonix-* headers before setting verified values
        proxy_set_header X-Anonix-User         $authenticated_user;
        proxy_set_header X-Anonix-Groups       $authenticated_groups;
        proxy_set_header X-Anonix-Proxy-Secret "${ANONIX_TRUSTED_PROXY_SECRET}";

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://anonix-gateway:8000;
    }
}
