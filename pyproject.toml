[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "anonix-gateway"
version = "0.1.0"
description = "Self-hosted on-the-fly data masking reverse proxy, API gateway, and admin control plane powered by anonix."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Adithya Nangarath" },
  { name = "Nikhilesh Kalahasti" },
]
keywords = [
  "data-masking",
  "privacy",
  "pii",
  "reverse-proxy",
  "api-gateway",
  "anonix",
  "self-hosted",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "anonix>=0.1.0,<0.2.0",
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "sqlalchemy[asyncio]>=2.0.30,<3.0.0",
  "alembic>=1.13.0,<2.0.0",
  "aiosqlite>=0.20.0,<1.0.0",
  "asyncpg>=0.29.0,<1.0.0",
  "httpx>=0.27.0,<1.0.0",
  "pydantic>=2.7.0,<3.0.0",
  "pydantic-settings>=2.3.0,<3.0.0",
  "argon2-cffi>=23.1.0,<25.0.0",
  "cryptography>=42.0.0,<45.0.0",
  "PyJWT[crypto]>=2.8.0,<3.0.0",
  "redis>=5.0.0,<6.0.0",
  "typer>=0.12.0,<1.0.0",
  "python-multipart>=0.0.9,<1.0.0",
  "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "respx>=0.21.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
anonix-gateway = "anonix_gateway.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/anonix_gateway"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
