# Optional Redis override for multi-replica distributed rate limiting.
# Combine with either the bundled stack or BYOD stack:
#   docker compose -f docker-compose.yml -f docker-compose.redis.yml up -d
#   docker compose -f docker-compose.byod.yml -f docker-compose.redis.yml up -d
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    environment:
      ANONIX_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
